name: CI

on:
  push:
    branches: ["main", "dev", "release/**"]
  pull_request:
    branches: ["main", "dev"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # 1. Format check
  # ---------------------------------------------------------------------------
  fmt:
    name: "Rustfmt check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # ---------------------------------------------------------------------------
  # 2. Clippy lint gate
  # ---------------------------------------------------------------------------
  clippy:
    name: "Clippy (deny warnings)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy --workspace --exclude plugin-pii-filter --all-targets --all-features -- -D warnings

  # ---------------------------------------------------------------------------
  # 3. Test suite
  # ---------------------------------------------------------------------------
  test:
    name: "Test suite (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo test (all host workspace crates)
        run: cargo test --workspace --exclude plugin-pii-filter --all-features

  # ---------------------------------------------------------------------------
  # 4. cargo check — ensures the workspace builds cleanly on MSRV + beta
  # ---------------------------------------------------------------------------
  check:
    name: "cargo check (${{ matrix.toolchain }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]

    steps:
      - uses: actions/checkout@v4

      - name: Install ${{ matrix.toolchain }} Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo check (workspace)
        run: cargo check --workspace --exclude plugin-pii-filter --all-features

  # ---------------------------------------------------------------------------
  # 5. Security audit
  # ---------------------------------------------------------------------------
  audit:
    name: "cargo audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
