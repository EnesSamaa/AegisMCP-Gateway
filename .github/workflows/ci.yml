name: CI

on:
  push:
    branches: ["main", "dev", "release/**"]
  pull_request:
    branches: ["main", "dev"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # 1. Format & Lint Verification
  # ---------------------------------------------------------------------------
  quality:
    name: "Code Quality (fmt & clippy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Gate
        run: cargo clippy --workspace --exclude plugin-pii-filter --all-targets --all-features -- -D warnings

  # ---------------------------------------------------------------------------
  # 2. Multi-OS Test Suite
  # ---------------------------------------------------------------------------
  test:
    name: "Test Suite (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Workspace Tests
        run: cargo test --workspace --exclude plugin-pii-filter --all-features

  # ---------------------------------------------------------------------------
  # 3. Helm Chart Validation
  # ---------------------------------------------------------------------------
  helm-lint:
    name: "Helm Chart Lint & Template"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm Lint
        run: helm lint deploy/helm/aegis-gateway

      - name: Validate Template Render
        run: helm template aegis deploy/helm/aegis-gateway --debug > /dev/null

  # ---------------------------------------------------------------------------
  # 4. Container Build Smoke Test
  # ---------------------------------------------------------------------------
  docker-smoke-test:
    name: "Docker Build Smoke Test"
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Test Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: aegismcp-gateway:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
