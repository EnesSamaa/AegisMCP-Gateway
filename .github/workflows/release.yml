name: Release & Container Publishing

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Multi-Arch Docker Container Build & Push to GHCR
  # ---------------------------------------------------------------------------
  docker-release:
    name: "Publish Multi-Arch Docker Image"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 2. Binary Release Asset Compilation
  # ---------------------------------------------------------------------------
  binary-release:
    name: "Build Release Binaries (${{ matrix.target }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_ext: ""
            archive_ext: "tar.gz"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_ext: ""
            archive_ext: "tar.gz"
            use_cross: true
          - os: macos-13
            target: x86_64-apple-darwin
            binary_ext: ""
            archive_ext: "tar.gz"
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_ext: ""
            archive_ext: "tar.gz"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_ext: ".exe"
            archive_ext: "zip"

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux' && !matrix.use_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config libssl-dev build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross Tool
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build Production Binaries
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p aegis-proxy --bin aegis-gateway -p aegis-cli --bin aegis-cli
          else
            cargo build --release --target ${{ matrix.target }} -p aegis-proxy --bin aegis-gateway -p aegis-cli --bin aegis-cli
          fi

      - name: Package Binary Archive (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          STAGING="aegis-gateway-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/aegis-gateway" "$STAGING/"
          cp "target/${{ matrix.target }}/release/aegis-cli" "$STAGING/"
          cp aegis.yaml "$STAGING/"
          tar czvf "${STAGING}.tar.gz" "$STAGING"

      - name: Package Binary Archive (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $Staging = "aegis-gateway-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $Staging
          Copy-Item "target/${{ matrix.target }}/release/aegis-gateway.exe" -Destination "$Staging/"
          Copy-Item "target/${{ matrix.target }}/release/aegis-cli.exe" -Destination "$Staging/"
          Copy-Item "aegis.yaml" -Destination "$Staging/"
          Compress-Archive -Path $Staging -DestinationPath "${Staging}.zip"

      - name: Upload Release Archive
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            aegis-gateway-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive_ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
