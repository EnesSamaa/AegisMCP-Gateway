apiVersion: v1
kind: Service
metadata:
  name: aegis-gateway
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-gateway
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: aegis-gateway
