apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aegis-gateway
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-gateway
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis-gateway
  endpoints:
    - port: http
      path: /metrics
      interval: 5s
      scrapeTimeout: 3s
