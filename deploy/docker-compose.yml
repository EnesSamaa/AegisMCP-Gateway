# ==============================================================================
# AegisMCP-Gateway Local Full-Stack Observability Compose
# Includes Aegis Gateway + Prometheus Metrics Scraper + Grafana Dashboard
# ==============================================================================

version: "3.8"

services:
  aegis-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: aegis-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - LISTEN_ADDR=0.0.0.0:8080
      - UPSTREAM_URL=http://upstream-mock:9090
      - RUST_LOG=info
    volumes:
      - ../aegis.yaml:/app/aegis.yaml:ro
    networks:
      - aegis-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: aegis-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - aegis-gateway
    networks:
      - aegis-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: aegis-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=aegis
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
    depends_on:
      - prometheus
    networks:
      - aegis-net

networks:
  aegis-net:
    driver: bridge
