# ==============================================================================
# Prometheus Scrape Configuration for AegisMCP-Gateway
# ==============================================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "aegis-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["aegis-gateway:8080"]
        labels:
          environment: "production"
          service: "aegis-mcp-gateway"
