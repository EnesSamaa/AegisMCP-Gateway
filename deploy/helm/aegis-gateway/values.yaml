# ==============================================================================
# Default values for aegis-gateway Helm chart.
# ==============================================================================

# Number of initial pod replicas (when autoscaling is disabled)
replicaCount: 2

image:
  repository: ghcr.io/enessamaa/aegismcp-gateway
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "v1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount API credentials to the ServiceAccount.
  automountServiceAccountToken: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
  hosts:
    - host: aegis.internal.company.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: aegis-gateway-tls
  #    hosts:
  #      - aegis.internal.company.com

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Prometheus Operator ServiceMonitor Integration
serviceMonitor:
  enabled: true
  namespace: ""
  interval: 5s
  scrapeTimeout: 3s
  labels:
    release: prometheus
  metricRelabelings: []

# Gateway configuration (generates ConfigMap mounted at /app/aegis.yaml)
config:
  server:
    listen_addr: "0.0.0.0:8080"
    default_timeout_ms: 30000
  routes:
    - path: "/mcp"
      upstream_url: "http://upstream-mcp-service:9090"
      required_role: "default"
      enabled: true
    - path: "/sse"
      upstream_url: "http://upstream-mcp-service:9090"
      required_role: "default"
      enabled: true
  roles:
    - role: "admin"
      allowed_tools:
        - "*"
      max_rate_limit: 10000
    - role: "default"
      allowed_tools:
        - "read_file"
        - "list_dir"
      max_rate_limit: 1000
  security:
    enable_wasm_guardrails: true
    enable_proof_logging: true

# Environment variables to pass to the container
env:
  - name: LISTEN_ADDR
    value: "0.0.0.0:8080"
  - name: RUST_LOG
    value: "info"

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - aegis-gateway
          topologyKey: kubernetes.io/hostname
