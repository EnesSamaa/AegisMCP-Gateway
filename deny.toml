# ==============================================================================
# cargo-deny configuration for AegisMCP-Gateway (cargo-deny 0.16+ compliant)
# ==============================================================================

[advisories]
yanked = "warn"
unmaintained = "none"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unicode-DFS-2015",
    "OpenSSL",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "Unlicense",
    "MIT-0",
    "NCSA",
    "CDDL-1.0",
]
confidence-threshold = 0.6
exceptions = []

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
deny = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
