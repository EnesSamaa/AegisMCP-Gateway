[package]
name        = "aegis-core"
version     = "1.0.0"
edition     = "2021"
description = "Core data structures, types, error definitions, and JSON-RPC / MCP protocol primitives for AegisMCP-Gateway"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/EnesSamaa/AegisMCP-Gateway"
keywords    = ["mcp", "json-rpc", "gateway", "security", "proxy"]
categories  = ["network-programming", "web-programming"]

[lints]
workspace = true

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
anyhow     = { workspace = true }
tracing    = { workspace = true }
uuid       = { workspace = true }
bytes      = { workspace = true }
sha2       = { workspace = true }

[dev-dependencies]
# Property-based testing
tokio = { workspace = true }
