[package]
name        = "aegis-wasm"
version     = "0.1.0"
edition     = "2021"
description = "Wasmtime 47 + WASI 0.2 runtime integration for AegisMCP-Gateway policy modules"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/EnesSamaa/AegisMCP-Gateway"
keywords    = ["wasm", "wasmtime", "wasi", "policy", "sandbox"]
categories  = ["wasm", "network-programming"]

[[bench]]
name    = "wasm_bench"
harness = false

[lints]
workspace = true

[dependencies]
aegis-core    = { path = "../aegis-core" }

wasmtime      = { workspace = true }
wit-bindgen   = { workspace = true }
tracing       = { workspace = true }
thiserror     = { workspace = true }
anyhow        = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
tokio         = { workspace = true }
ed25519-dalek = { workspace = true }
semver        = { workspace = true }

[dev-dependencies]
tokio     = { workspace = true }
criterion = { workspace = true }
