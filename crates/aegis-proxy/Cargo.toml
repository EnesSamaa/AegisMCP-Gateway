[package]
name        = "aegis-proxy"
version     = "1.0.0"
edition     = "2021"
description = "Tokio + Hyper v1 asynchronous reverse-proxy engine for AegisMCP-Gateway"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/EnesSamaa/AegisMCP-Gateway"
keywords    = ["proxy", "hyper", "tokio", "gateway", "mcp"]
categories  = ["network-programming", "web-programming"]

[[bin]]
name = "aegis-gateway"
path = "src/main.rs"

[[bench]]
name    = "proxy_throughput"
harness = false

[lints]
workspace = true

[dependencies]
aegis-core       = { path = "../aegis-core" }
aegis-guardrails = { path = "../aegis-guardrails" }
aegis-wasm       = { path = "../aegis-wasm" }
aegis-proof      = { path = "../aegis-proof" }

tokio          = { workspace = true }
hyper          = { workspace = true }
hyper-util     = { workspace = true }
http-body-util = { workspace = true }
tower          = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
config         = { workspace = true }
notify         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror      = { workspace = true }
anyhow         = { workspace = true }
bytes          = { workspace = true }
uuid           = { workspace = true }
metrics                    = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

[dev-dependencies]
tokio     = { workspace = true }
uuid      = { workspace = true }
criterion = { workspace = true }
