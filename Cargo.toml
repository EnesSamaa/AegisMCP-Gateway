[workspace]
resolver = "2"
members = [
    "crates/aegis-core",
    "crates/aegis-proxy",
    "crates/aegis-wasm",
    "crates/aegis-guardrails",
    "crates/aegis-proof",
    "plugins/plugin-pii-filter",
]

# ---------------------------------------------------------------------------
# Workspace-level shared dependencies (referenced via `workspace = true`)
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Async runtime
tokio          = { version = "1.53", features = ["full"] }

# HTTP layer (hyper v1 ecosystem)
hyper          = { version = "1.11", features = ["client", "server", "http1", "http2"] }
hyper-util     = { version = "0.1",  features = ["tokio", "client", "client-legacy", "server", "http1", "http2", "service"] }
http-body-util = { version = "0.1" }
tower          = { version = "0.5",  features = ["util"] }

# WASM runtime
wasmtime       = { version = "47", features = ["async", "component-model"] }
wit-bindgen    = { version = "0.36", features = ["realloc"] }

# Serialization & Config
serde          = { version = "1.0", features = ["derive"] }
serde_json     = { version = "1.0" }
config         = { version = "0.15", features = ["yaml"] }
notify         = { version = "8.0" }

# Observability
tracing            = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Security & Crypto
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
semver        = { version = "1.0" }

# Error handling
thiserror = { version = "2.0" }
anyhow    = { version = "1.0" }

# Utilities
bytes = { version = "1.0" }
uuid  = { version = "1.0", features = ["v4", "serde"] }

# Benchmarking
criterion = { version = "0.5", features = ["async_tokio"] }

# ---------------------------------------------------------------------------
# Workspace-wide lints (Clippy + rustc)
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code          = "deny"
missing_docs         = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all                       = { level = "deny",  priority = -1 }
pedantic                  = { level = "warn",  priority = -1 }
nursery                   = { level = "warn",  priority = -1 }
# Commonly noisy pedantic lints we intentionally relax
module_name_repetitions   = "allow"
must_use_candidate        = "allow"
missing_errors_doc        = "allow"
missing_panics_doc        = "allow"
same_length_and_capacity  = { level = "allow", priority = 1 }

# ---------------------------------------------------------------------------
# Release profile — maximum binary performance
# ---------------------------------------------------------------------------
[profile.release]
opt-level       = 3
lto             = "fat"
codegen-units   = 1
strip           = true
panic           = "abort"
debug           = false

# Fast dev builds that still run reasonably quickly
[profile.dev]
opt-level  = 1
debug      = true
incremental = true

# Profile used by `cargo test` — keeps debuginfo for better backtraces
[profile.test]
opt-level = 1
debug     = true
